  <text x="470" y="795" class="small">电池</text>
  <text x="470" y="830" class="small">隐藏供电模块</text>
  <line x1="760" y1="682" x2="760" y2="735" class="dim"/>

  <path d="M590 955C630 915 890 915 930 955V1050C900 1080 620 1080 590 1050Z" class="fillStone"/>
  <path d="M590 955C630 915 890 915 930 955V1050C900 1080 620 1080 590 1050Z" class="line"/>
  <ellipse cx="760" cy="955" rx="170" ry="42" class="thin"/>
  <circle cx="430" cy="1010" r="22" class="dot"/>
  <text x="423" y="1018" class="num">5</text>
  <text x="470" y="1000" class="small">大理石底座</text>
