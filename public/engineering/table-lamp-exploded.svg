  <line x1="760" y1="215" x2="760" y2="985" class="dash"/>
  <path d="M565 205C602 175 918 175 955 205L905 365C870 390 650 390 615 365Z" class="fillGlass"/>
  <path d="M565 205C602 175 918 175 955 205L905 365C870 390 650 390 615 365Z" class="line"/>
  <ellipse cx="760" cy="205" rx="195" ry="34" class="thin"/>
  <circle cx="430" cy="285" r="22" class="dot"/>
