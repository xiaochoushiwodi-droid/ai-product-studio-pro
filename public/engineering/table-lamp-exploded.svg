  <text x="470" y="645" class="small">LED光源</text>
  <text x="470" y="680" class="small">居中发光模组</text>
  <line x1="760" y1="552" x2="760" y2="612" class="dim"/>

  <path d="M688 742H832V848H688Z" class="dash"/>
  <text x="704" y="805" class="small">电池</text>
  <circle cx="430" cy="805" r="22" class="dot"/>
