  <text x="470" y="510" class="small">金属环</text>
  <text x="470" y="545" class="small">固定环与 LED 座</text>
  <line x1="760" y1="392" x2="760" y2="480" class="dim"/>

  <rect x="680" y="620" width="160" height="54" rx="10" class="fillMetal"/>
  <rect x="680" y="620" width="160" height="54" rx="10" class="line"/>
  <circle cx="430" cy="655" r="22" class="dot"/>
