<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Table lamp exploded engineering drawing">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f3b45" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#68e8ff"/>
    </marker>
    <style>
      .bg{fill:#090b0f}.grid{fill:url(#grid)}.line{fill:none;stroke:#d7fbff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#68e8ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#68e8ff;stroke-width:2;stroke-dasharray:14 12}.dim{fill:none;stroke:#68e8ff;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.label{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#e8fbff;font-size:34px;font-weight:700}.small{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#9ecbd3;font-size:24px;font-weight:700}.micro{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#70e5ff;font-size:20px;font-weight:700;letter-spacing:1px}.num{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#090b0f;font-size:22px;font-weight:900}.fillGlass{fill:#dffaff;fill-opacity:.08}.fillStone{fill:#d7fbff;fill-opacity:.04}.fillMetal{fill:#68e8ff;fill-opacity:.14}.dot{fill:#68e8ff}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <rect class="grid" width="1600" height="1200"/>
  <text x="90" y="105" class="micro">工程尺寸图 / 爆炸图</text>
