  <text x="1045" y="415" class="small">2. 金属环</text>
  <text x="1045" y="465" class="small">3. LED光源</text>
  <text x="1045" y="515" class="small">4. 电池</text>
  <text x="1045" y="565" class="small">5. 大理石底座</text>
  <line x1="1045" y1="620" x2="1370" y2="620" class="thin"/>
  <text x="1045" y="675" class="small">锁定比例：总高 23cm</text>
  <text x="1045" y="725" class="small">灯罩：17cm</text>
  <text x="1045" y="775" class="small">底座：8cm</text>
</svg>
