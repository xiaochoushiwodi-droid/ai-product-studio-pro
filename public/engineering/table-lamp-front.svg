<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Table lamp front engineering dimension drawing">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f3b45" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#68e8ff"/>
    </marker>
    <style>
      .bg{fill:#090b0f}.grid{fill:url(#grid)}.line{fill:none;stroke:#d7fbff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#68e8ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#68e8ff;stroke-width:2;stroke-dasharray:14 12}.dim{fill:none;stroke:#68e8ff;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.label{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#e8fbff;font-size:34px;font-weight:700}.small{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#9ecbd3;font-size:24px;font-weight:700}.micro{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#70e5ff;font-size:20px;font-weight:700;letter-spacing:1px}.fillGlass{fill:#dffaff;fill-opacity:.08}.fillStone{fill:#d7fbff;fill-opacity:.04}.fillMetal{fill:#68e8ff;fill-opacity:.14}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <rect class="grid" width="1600" height="1200"/>
  <text x="90" y="105" class="micro">工程尺寸图 / 正视图</text>
  <text x="90" y="150" class="label">台灯</text>
  <text x="90" y="188" class="small">玻璃灯罩 / 金属环 / LED光源 / 电池 / 大理石底座</text>

  <line x1="800" y1="185" x2="800" y2="940" class="dash"/>
  <path d="M605 235C642 205 958 205 995 235L935 500C900 525 700 525 665 500Z" class="fillGlass"/>
  <path d="M605 235C642 205 958 205 995 235L935 500C900 525 700 525 665 500Z" class="line"/>
  <ellipse cx="800" cy="235" rx="195" ry="34" class="thin"/>
  <path d="M660 535H940V590H660Z" class="fillMetal"/>
  <path d="M660 535H940V590H660Z" class="line"/>
  <rect x="720" y="602" width="160" height="44" rx="8" class="fillMetal"/>
  <rect x="720" y="602" width="160" height="44" rx="8" class="thin"/>
  <text x="747" y="632" class="small">LED</text>
  <path d="M735 655H865V775H735Z" class="dash"/>
  <text x="700" y="730" class="small">电池</text>
  <path d="M630 800C670 760 930 760 970 800V895C940 925 660 925 630 895Z" class="fillStone"/>
  <path d="M630 800C670 760 930 760 970 800V895C940 925 660 925 630 895Z" class="line"/>
  <ellipse cx="800" cy="800" rx="170" ry="42" class="thin"/>

  <line x1="520" y1="235" x2="520" y2="895" class="dim"/>
  <line x1="550" y1="235" x2="605" y2="235" class="thin"/>
  <line x1="550" y1="895" x2="630" y2="895" class="thin"/>
  <text x="375" y="580" class="label" transform="rotate(-90 375 580)">总高 23cm</text>

  <line x1="605" y1="170" x2="995" y2="170" class="dim"/>
  <line x1="605" y1="190" x2="605" y2="235" class="thin"/>
  <line x1="995" y1="190" x2="995" y2="235" class="thin"/>
  <text x="685" y="135" class="label">灯罩 17cm</text>

  <line x1="630" y1="970" x2="970" y2="970" class="dim"/>
  <line x1="630" y1="925" x2="630" y2="990" class="thin"/>
  <line x1="970" y1="925" x2="970" y2="990" class="thin"/>
  <text x="700" y="1032" class="label">底座 8cm</text>

  <text x="1120" y="345" class="small">玻璃灯罩</text>
  <line x1="1090" y1="355" x2="930" y2="420" class="thin"/>
  <text x="1120" y="570" class="small">金属环</text>
  <line x1="1090" y1="562" x2="940" y2="562" class="thin"/>
  <text x="1120" y="635" class="small">LED光源</text>
  <line x1="1090" y1="628" x2="880" y2="625" class="thin"/>
  <text x="1120" y="740" class="small">电池仓</text>
  <line x1="1090" y1="732" x2="865" y2="720" class="thin"/>
  <text x="1120" y="855" class="small">大理石底座</text>
  <line x1="1090" y1="847" x2="960" y2="830" class="thin"/>
</svg>
