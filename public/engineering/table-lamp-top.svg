<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="Table lamp top engineering dimension drawing">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f3b45" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#68e8ff"/>
    </marker>
    <style>
      .bg{fill:#090b0f}.grid{fill:url(#grid)}.line{fill:none;stroke:#d7fbff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#68e8ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#68e8ff;stroke-width:2;stroke-dasharray:14 12}.dim{fill:none;stroke:#68e8ff;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}.label{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#e8fbff;font-size:34px;font-weight:700}.small{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#9ecbd3;font-size:24px;font-weight:700}.micro{font-family:"Microsoft YaHei","SimHei",Arial,Helvetica,sans-serif;fill:#70e5ff;font-size:20px;font-weight:700;letter-spacing:1px}.fillGlass{fill:#dffaff;fill-opacity:.08}.fillStone{fill:#d7fbff;fill-opacity:.04}.fillMetal{fill:#68e8ff;fill-opacity:.14}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1200"/>
  <rect class="grid" width="1600" height="1200"/>
  <text x="90" y="105" class="micro">工程尺寸图 / 顶视图</text>
  <text x="90" y="150" class="label">台灯</text>
  <text x="90" y="188" class="small">灯罩、金属环、LED、电池与底座同心占位</text>

  <circle cx="800" cy="560" r="285" class="fillGlass"/>
  <circle cx="800" cy="560" r="285" class="line"/>
  <circle cx="800" cy="560" r="205" class="thin"/>
  <circle cx="800" cy="560" r="132" class="fillMetal"/>
  <circle cx="800" cy="560" r="132" class="line"/>
  <circle cx="800" cy="560" r="70" class="thin"/>
  <rect x="706" y="682" width="188" height="104" rx="18" class="dash"/>
  <rect x="640" y="400" width="320" height="320" rx="48" class="fillStone"/>
  <rect x="640" y="400" width="320" height="320" rx="48" class="thin"/>
  <line x1="800" y1="225" x2="800" y2="895" class="dash"/>
  <line x1="465" y1="560" x2="1135" y2="560" class="dash"/>

  <line x1="515" y1="240" x2="1085" y2="240" class="dim"/>
  <line x1="515" y1="270" x2="515" y2="560" class="thin"/>
  <line x1="1085" y1="270" x2="1085" y2="560" class="thin"/>
  <text x="670" y="205" class="label">灯罩 17cm</text>

  <line x1="640" y1="890" x2="960" y2="890" class="dim"/>
  <line x1="640" y1="720" x2="640" y2="912" class="thin"/>
  <line x1="960" y1="720" x2="960" y2="912" class="thin"/>
  <text x="695" y="952" class="label">底座 8cm</text>

  <text x="1120" y="420" class="small">玻璃灯罩外沿</text>
  <line x1="1090" y1="430" x2="1030" y2="430" class="thin"/>
  <text x="1120" y="535" class="small">金属环</text>
  <line x1="1090" y1="528" x2="932" y2="530" class="thin"/>
  <text x="1120" y="625" class="small">LED 中心</text>
  <line x1="1090" y1="618" x2="870" y2="585" class="thin"/>
  <text x="1120" y="742" class="small">电池检修位</text>
  <line x1="1090" y1="734" x2="890" y2="735" class="thin"/>
  <text x="1120" y="828" class="small">大理石底座占位</text>
  <line x1="1090" y1="820" x2="958" y2="705" class="thin"/>
</svg>
